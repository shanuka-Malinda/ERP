<div class="login-form">
  <div class="form-header">
    Login
  </div>
  <div class="form-body">
    <app-input label="Username" placeholder="Enter username" [required]="true"></app-input>
    <app-input label="Password" type="password" placeholder="Enter password" [required]="true"></app-input>
  </div>
  <div class="form-footer">
    <app-clear-btn label="Clear" [loading]="loadingClear" [disabled]="false" (clear)="clear()"></app-clear-btn>
    <app-login-btn label="Login" [loading]="loadingLogin" [disabled]="false" (login)="login()"></app-login-btn>
  </div>
</div>
